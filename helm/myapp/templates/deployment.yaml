apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend   # .Release.Name = what you pass to helm install
                                        # e.g. "helm install myapp-prod" → name = myapp-prod-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}   # e.g. myapp-1.0.0
    release: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}   # Only set replicas if HPA is disabled
  replicas: {{ .Values.replicaCount }}         # If HPA is on, it manages replica count
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
      - name: frontend
        # Combines image.repository:image.tag — e.g. "nginx:1.25-alpine"
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}   # from values.yaml
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        # Conditional liveness probe — only added if livenessProbe.enabled: true in values.yaml
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: 80
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
        {{- end }}
        # Conditional readiness probe
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: 80
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
        {{- end }}