apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
  - Ingress
  ingress:
  - # MySQL ONLY accepts connections from backend pods
    from:
    - podSelector:
        matchLabels:
          app: backend     # ONLY backend — not frontend, not anything else
    ports:
    - port: 3306