apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: log-agent
  namespace: production

spec:
  selector:
    matchLabels:
      app: log-agent

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: log-agent

    spec:
      tolerations:
        - operator: Exists

      containers:
        - name: log-agent
          image: busybox:1.35

          command:
            - sh
            - -c
            - |
              while true; do
                echo "[$(date)] Log agent running on node: $NODE_NAME"
                echo "[$(date)] Scanning /host/logs for new log files..."
                ls /host/logs/ 2>/dev/null | head -5
                sleep 30
              done

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          volumeMounts:
            - name: node-logs
              mountPath: /host/logs
              readOnly: true

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"

      volumes:
        - name: node-logs
          hostPath:
            path: /var/log