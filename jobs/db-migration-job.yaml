apiVersion: batch/v1
kind: Job

metadata:
  name: db-migration
  namespace: production

spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: db-migration

    spec:
      restartPolicy: OnFailure

      containers:
        - name: db-migration
          image: busybox:1.35

          command:
            - sh
            - -c
            - |
              echo "Starting DB migration at $(date)..."
              echo "Connecting to database using $DB_USERNAME..."
              echo "Creating tables: users, orders, products..."
              sleep 5
              echo "Running schema migrations..."
              sleep 5
              echo "Migration complete! All tables created."
              exit 0

          envFrom:
            - secretRef:
                name: backend-secret

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"