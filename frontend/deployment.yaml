apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: production
  labels:
    app: frontend
    tier: web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      # Node Affinity: Prefer scheduling on productions-worker
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - productions-worker

      # Toleration: Allow pods to run on nodes tainted with app=frontend:NoSchedule
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "frontend"
          effect: "NoSchedule"

      containers:
        # Main Nginx Container
        - name: nginx
          image: nginx:1.25-alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

        # Sidecar Log Collector
        - name: log-collector
          image: busybox:1.35

          command:
            - sh
            - -c
            - while true; do echo "[LOG] Frontend alive $(date)"; sleep 30; done

          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "20m"