apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: production
  labels:
    app: frontend
    tier: web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - productions-worker

      tolerations:
        - key: "app"
          operator: "Equal"
          value: "frontend"
          effect: "NoSchedule"

      volumes:
        - name: shared-logs
          emptyDir: {}

        - name: nginx-config-vol
          configMap:
            name: frontend-config
            items:
              - key: nginx.conf
                path: nginx.conf

      containers:
        - name: nginx
          image: nginx:1.25-alpine

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: frontend-config

          volumeMounts:
            - name: nginx-config-vol
              mountPath: /etc/nginx/conf.d

            - name: shared-logs
              mountPath: /var/log/app

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

        - name: log-collector
          image: busybox:1.35

          command:
            - sh
            - -c
            - while true; do tail -f /logs/access.log 2>/dev/null; sleep 5; done

          volumeMounts:
            - name: shared-logs
              mountPath: /logs

          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "20m"