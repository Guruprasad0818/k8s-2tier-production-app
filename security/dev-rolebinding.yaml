apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-pod-reader
  namespace: production
subjects:                    # WHO gets the role
- kind: User                  # can be User, Group, or ServiceAccount
  name: dev-user              # must match CN in certificate
  apiGroup: rbac.authorization.k8s.io
roleRef:                      # WHAT role they get
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io